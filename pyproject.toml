[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-emulator"
version = "0.1.0"
description = "FastChem/VULCAN chemistry surrogate with sulfur chemistry and WASP-39b stellar forcing."
readme = "docs/README.md"
requires-python = ">=3.9"
dependencies = [
  "jax>=0.4",
  "numpy>=1.24",
  "scipy>=1.11",
  "h5py>=3.8",
  "optuna>=3.5",
  "optax>=0.2.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
exogibbs = [
  "exogibbs",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["uni_tests"]

[tool.ruff]
src = ["src", "uni_tests"]
target-version = "py39"

[tool.ruff.lint]
extend-select = ["I"]
