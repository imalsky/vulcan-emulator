[project]
name = "vulcan-emulator"
version = "0.1.0"
description = "Fail-fast ML surrogate pipeline for VULCAN thermochemical trajectories"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.2",
  "tqdm>=4.66"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "RUF"]

[tool.vulture]
min_confidence = 80
paths = ["src", "testing"]
